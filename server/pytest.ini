[pytest]
# Run from the server/ directory:  py -m pytest
# `pythonpath = .` puts server/ on sys.path so `import app` resolves to server/app.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra
# Markers keep the pyramid layers explicit and independently runnable:
#   py -m pytest -m unit        /  py -m pytest -m integration
markers =
    unit: fast, isolated tests (no DB, no network; at most a bare request context) — the pyramid base
    integration: multiple units through the real Flask app — the pyramid middle
